<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Safe Exam Browser</title>
    <link rel="stylesheet" href="quit.css">
  </head>
  <body>
    <main id="confirmationDialog" class="window confirmation" role="dialog" aria-modal="true" aria-labelledby="confirmationTitle" hidden>
      <div class="titlebar">
        <span id="confirmationTitle">Quit?</span>
        <button class="close" type="button" data-cancel aria-label="Close">×</button>
      </div>
      <div class="messageBody">
        <div class="questionIcon" aria-hidden="true">?</div>
        <p>Do you want to quit SEB?</p>
      </div>
      <div class="buttonBar">
        <button id="yesButton" type="button" class="defaultButton">Yes</button>
        <button type="button" data-cancel>No</button>
      </div>
    </main>

    <main id="passwordDialog" class="window passwordDialog" role="dialog" aria-modal="true" aria-labelledby="passwordTitle" hidden>
      <div class="titlebar">
        <span id="passwordTitle">Password Required</span>
        <button class="close" type="button" data-cancel aria-label="Close">×</button>
      </div>
      <form id="passwordForm">
        <div class="passwordBody">
          <svg class="keyIcon" viewBox="0 0 64 64" aria-hidden="true">
            <circle cx="21" cy="22" r="12" fill="none" stroke="currentColor" stroke-width="7"/>
            <path fill="none" stroke="currentColor" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" d="M30 31l24 24m-9-9l7-7m-15-1l7-7"/>
          </svg>
          <label for="password">
            <span>Please enter the quit password in order to terminate SEB:</span>
            <input id="password" type="password" autocomplete="off" required>
          </label>
          <p id="error" role="alert" hidden></p>
        </div>
        <div class="buttonBar">
          <button id="confirmButton" type="submit" class="defaultButton">OK</button>
          <button type="button" data-cancel>Cancel</button>
        </div>
      </form>
    </main>
    <script src="quit.js"></script>
  </body>
</html>
