<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="colors.css">
    <style>
        :root {
            --font: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
            --dodger-blue: #1e90ff;
            --secondary-text: #666;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html, body {
            font-family: var(--font);
            background: transparent;
            overflow: hidden;
            width: 100%;
            height: 100%;
        }

        /* ===== PAGE CONTENT (behind everything) ===== */
        #pageContent {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: white;
            z-index: 1;
            display: none;
            overflow: auto;
            padding: 30px;
            font-size: 14px;
            line-height: 1.5;
            color: #333;
        }

        #pageContent h1 {
            margin-bottom: 12px;
            font-size: 20px;
        }

        #pageContent p {
            margin-bottom: 10px;
        }

        /* ===== SPLASH COMMON ===== */
        .splash-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            user-select: none;
            display: none;
        }

        .splash-image-container {
            position: relative;
            width: 320px;
        }

        .splash-image-container img {
            width: 100%;
            display: block;
            -webkit-user-drag: none;
        }

        .info-section {
            position: absolute;
            top: 64px;
            left: 184px;
            font-family: var(--font);
        }

        .info-section .version-num {
            font-size: 11px;
            color: #383838;
            width: 160px;
        }

        .info-section .build-num {
            font-size: 6px;
            color: var(--secondary-text);
            width: 160px;
            margin-top: 2px;
        }

        .info-section .copyright {
            font-size: 10px;
            width: 136px;
            color: var(--secondary-text);
            margin-top: 6px;
        }

        /* ===== PROGRESS BAR ===== */
        .progress-bar {
            position: relative;
            width: 100%;
            height: 18px;
            background: #e0e0e0;
            overflow: hidden;
        }

        .progress-bar .fill {
            height: 100%;
            width: 0%;
            transition: width 0.12s ease;
        }

        .progress-bar.green .fill {
            background: #44b033;
        }

        .progress-bar.blue .fill {
            background: var(--dodger-blue);
        }

        .progress-bar .bar-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 9px;
            color: #222;
            white-space: nowrap;
            z-index: 2;
            pointer-events: none;
        }

        /* Indeterminate animation */
        .progress-bar .fill.indeterminate {
            position: absolute;
            top: 0;
            width: 20% !important;
            transition: none;
            animation: slideBar var(--slide-duration, 800ms) linear infinite;
        }

        @keyframes slideBar {
            0% {
                left: -20%;
            }
            100% {
                left: 100%;
            }
        }

        /* ===== SMALL SPLASH ===== */
        #smallSplash {
            z-index: 20;
            width: 320px;
            background: white;
            border: 1.2px solid var(--dodger-blue);
        }

        #smallSplash .splash-image-container {
            width: 320px;
        }

        /* ===== BIG SPLASH ===== */
        #bigSplash {
            z-index: 10;
            width: 880px;
            background: white;
            border: 1.2px solid var(--dodger-blue);
        }

        #bigSplash .top-padding {
            height: 8px;
        }

        #bigSplash .splash-image-wrapper {
            display: flex;
            justify-content: center;
        }

        #bigSplash .splash-image-container {
            width: 320px;
        }

        #bigSplash .progress-wrapper {
            padding: 6px 12px 0;
        }

        #bigSplash .bottom-padding {
            height: 240px;
        }
    </style>
</head>

<body>
    <!-- Big Splash -->
    <div id="bigSplash" class="splash-overlay">
        <div class="top-padding"></div>
        <div class="splash-image-wrapper">
            <div class="splash-image-container">
                <img src="../icons/SebSplashScreen.png" alt="SEB Logo" />
                <div class="info-section">
                    <div class="version-num"></div>
                    <div class="build-num"></div>
                    <div class="copyright">Copyright &copy; 2025 ETH Zürich, IT Services</div>
                </div>
            </div>
        </div>
        <div class="progress-wrapper">
            <div class="progress-bar blue">
                <div class="fill"></div>
                <div class="bar-text"></div>
            </div>
        </div>
        <div class="bottom-padding"></div>
    </div>

    <!-- Small Splash -->
    <div id="smallSplash" class="splash-overlay">
        <div class="splash-image-container">
            <img src="../icons/SebSplashScreen.png" alt="SEB Logo" />
            <div class="info-section">
                <div class="version-num"></div>
                <!-- No build number on small splash -->
                <div class="copyright">Copyright &copy; 2025 ETH Zürich, IT Services</div>
            </div>
        </div>
        <div class="progress-bar green">
            <div class="fill"></div>
            <div class="bar-text"></div>
        </div>
    </div>
    <script type="text/plain">
        // ============================================================
        // CONFIGURATION
        // ============================================================
        const sebBuild = "3.10.1.864";
        const sebVersion =
            sebBuild.split(".").slice(0, 3).join(".") + " (x64)";

        // ============================================================
        // DOM REFERENCES
        // ============================================================
        const smallSplash = document.getElementById("smallSplash");
        const bigSplash = document.getElementById("bigSplash");
        const pageContent = document.getElementById("pageContent");

        const smallFill = smallSplash.querySelector(".fill");
        const smallBarText = smallSplash.querySelector(".bar-text");
        const smallInfo = smallSplash.querySelector(".info-section");

        const bigFill = bigSplash.querySelector(".fill");
        const bigBarText = bigSplash.querySelector(".bar-text");

        // Populate version info
        smallSplash.querySelector(".version-num").textContent =
            `Version ${sebVersion}`;
        bigSplash.querySelector(".version-num").textContent =
            `Version ${sebVersion}`;
        bigSplash.querySelector(".build-num").textContent =
            `Build ${sebBuild}`;

        // ============================================================
        // HELPER FUNCTIONS — used inside the sequence
        // ============================================================
        const wait = (ms) => new Promise((r) => setTimeout(r, ms));

        function showSmall() {
            smallSplash.style.display = "block";
        }
        function hideSmall() {
            smallSplash.style.display = "none";
        }
        function showBig() {
            bigSplash.style.display = "block";
        }
        function hideBig() {
            bigSplash.style.display = "none";
        }
        function showContent() {
            if (pageContent) pageContent.style.display = "block";
        }

        function setSmallProgress(value, text = "") {
            smallFill.classList.remove("indeterminate");
            smallFill.style.width = value + "%";
            smallBarText.textContent = text;
        }

        function setBigProgress(value, text = "") {
            bigFill.classList.remove("indeterminate");
            bigFill.style.width = value + "%";
            bigBarText.textContent = text;
        }

        function setBigIndeterminate(durationMs = 4000) {
            bigFill.style.setProperty(
                "--slide-duration",
                durationMs + "ms"
            );
            bigFill.classList.add("indeterminate");
        }

        function showSmallInfo(visible) {
            smallInfo.style.display = visible ? "" : "none";
        }

        function setCursorLoading() {
            document.body.style.cursor = "wait";
        }
        function setCursorDefault() {
            document.body.style.cursor = "default";
        }

        /**
         * Animate trailing dots on an element.
         * Cycles 0 → 1 → 2 → 3 → 0 …
         * @param {HTMLElement} el  — element whose textContent is set
         * @param {string} base    — base text (dots appended)
         * @param {number} totalMs — total duration
         * @param {number} tick    — ms between each dot change
         */
        async function animateDots(el, base, totalMs, tick = 500) {
            let dots = 0;
            const end = Date.now() + totalMs;
            while (Date.now() < end) {
                el.textContent = base + ".".repeat(dots);
                dots = (dots + 1) % 4;
                await wait(tick);
            }
        }

        // ============================================================
        // ANIMATION SEQUENCE
        // ────────────────────────────────────────────────────────────
        // Each entry is an async function. Edit / reorder / add /
        // remove entries freely — the runner simply awaits each one
        // in order.
        // ============================================================
        const sequence = [
            // 1 — show small splash, progress 100 %
            async () => {
                showSmall();
                setSmallProgress(100);
            },

            // 2
            async () => await wait(250),

            // 3 — show big splash behind small, progress 100 %
            async () => {
                showBig();
                setBigProgress(100);
            },

            // 4
            async () => await wait(250),

            // 5 — big progress → 0 %
            async () => setBigProgress(0),

            // 6
            async () => await wait(250),

            // 7 — small progress → 0 %
            async () => setSmallProgress(0),

            // 8
            async () => await wait(250),

            // 9
            async () =>
                setSmallProgress(40, "Starting communication host"),

            // 10
            async () => await wait(500),

            // 11
            async () => setSmallProgress(75, "Verifying integrity"),

            // 12‑14 — big indeterminate, hide small, wait
            async () => {
                setBigIndeterminate(4000);
                await wait(1500); // let animation play visibly
                hideSmall();
                await wait(250);
            },

            // 15
            async () =>
                setBigProgress(0, "Initializing configuration"),

            // 16
            async () => await wait(250),

            // 17
            async () =>
                setBigProgress(
                    33,
                    "Validating remote session policy"
                ),

            // 18
            async () => await wait(250),

            // 19
            async () =>
                setBigProgress(
                    65,
                    "Validating display configuration policy"
                ),

            // 20 — dots animation for 1500 ms
            async () =>
                await animateDots(
                    bigBarText,
                    "Validating display configuration policy",
                    1500,
                    500
                ),

            // 21
            async () =>
                setBigProgress(70, "Initializing service session"),

            // 22
            async () => await wait(500),

            // 23
            async () => setBigProgress(90, "Starting client"),

            // 24 — show small again, prog 100 %, hide info, no bar text
            async () => {
                showSmall();
                setSmallProgress(100);
                showSmallInfo(false);
            },

            // 25
            async () => await wait(250),

            // 26
            async () =>
                setSmallProgress(
                    5,
                    "Initializing runtime connection"
                ),

            // 27
            async () => await wait(250),

            // 28
            async () =>
                setSmallProgress(10, "Initializing configuration"),

            // 29
            async () => await wait(375),

            // 30 — prog 40 %, show info again
            async () => {
                setSmallProgress(40, "Initializing configuration");
                showSmallInfo(true);
            },

            // 31
            async () =>
                setSmallProgress(40, "Starting communication host"),

            // 32
            async () => await wait(500),

            // 33
            async () =>
                setSmallProgress(60, "Initializing application"),

            // 34
            async () => {
                await wait(250);
                setSmallProgress(70, "Initializing user interface");
            },

            // 35
            async () => {
                await wait(500);
                setSmallProgress(80, "Initializing browser");
            },

            // 36
            async () => {
                await wait(125);
                setCursorLoading();
                await wait(250);
            },

            // 37
            async () => {
                setCursorDefault();
                setSmallProgress(100, "Initializing clipboard");
            },

            // 38
            async () => await wait(250),

            // 39 — show page content behind splashes
            async () => showContent(),

            // 40
            async () => await wait(250),

            // 41
            async () => setCursorLoading(),

            // 42
            async () => await wait(250),

            // 43 — hide small
            async () => hideSmall(),

            // 44
            async () => await wait(250),

            // 45 — big prog 0 %, "SEB is running"
            async () => setBigProgress(0, "SEB is running"),

            // 46
            async () => await wait(500),

            // 47 — hide big, restore cursor
            async () => {
                hideBig();
                setCursorDefault();
            },
        ];

        // ============================================================
        // RUNNER — iterates the sequence array
        // ============================================================
        async function runSequence() {
            for (const step of sequence) {
                await step();
            }
            parent.postMessage({ type: "SEB_STARTUP_COMPLETE" }, "*");
        }

        runSequence();
    </script>
    <script src="startup.js"></script>
    </body>
</html>
