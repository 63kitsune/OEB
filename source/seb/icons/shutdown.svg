    <path d="M 512,902 C 296.61,902 122,727.28 122,511.74 C 122,388.11 179.45,277.91 269.09,206.4" 
          stroke="#000" stroke-width="79" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <!-- Power button right curve -->
