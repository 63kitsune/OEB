<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Safe Exam Browser taskbar</title>
    <link rel="stylesheet" href="colors.css">
    <style>
      :root { --taskbar-height: 40px; --taskbar-scale: 1; }
      * { box-sizing: border-box; }
      html, body { width: 100%; height: var(--taskbar-height); margin: 0; overflow: hidden; background: transparent; }
      .taskbar {
        display: flex;
        align-items: stretch;
        width: 100%;
        height: var(--taskbar-height);
        color: var(--primary-text);
        background: var(--background);
        border-top: 1px solid #d8d8d8;
        font-family: var(--font);
        user-select: none;
      }
      .left, .right { display: flex; align-items: stretch; }
      .right { margin-left: auto; }
      .app {
        display: flex;
        align-items: center;
        min-width: calc(126px * var(--taskbar-scale));
        padding: 0 calc(10px * var(--taskbar-scale));
        gap: calc(8px * var(--taskbar-scale));
      }
      .app img {
        width: calc(25px * var(--taskbar-scale));
        height: calc(25px * var(--taskbar-scale));
        object-fit: contain;
      }
      .app span { font-size: calc(12px * var(--taskbar-scale)); white-space: nowrap; }
      button.control, .clock {
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: var(--taskbar-height);
        height: var(--taskbar-height);
        padding: 0 calc(9px * var(--taskbar-scale));
        border: max(1px, calc(1px * var(--taskbar-scale))) solid transparent;
        color: #222;
        background: var(--background);
        font: 600 calc(12px * var(--taskbar-scale)) var(--font);
      }
      button.control { cursor: pointer; }
      button.control:hover { border-color: var(--dodger-blue); background: var(--light-blue); }
      button.control:active { border-width: max(2px, calc(2px * var(--taskbar-scale))); border-color: var(--sky-blue); }
      button.control svg { width: calc(24px * var(--taskbar-scale)); height: calc(24px * var(--taskbar-scale)); }
      button.control img { width: calc(25px * var(--taskbar-scale)); height: calc(25px * var(--taskbar-scale)); object-fit: contain; }
      .clock {
        flex-direction: column;
        min-width: calc(76px * var(--taskbar-scale));
        color: var(--secondary-text);
        font-weight: 500;
        line-height: 1.05;
      }
      .clock #time { font-weight: 700; }
      .clock #date { margin-top: calc(2px * var(--taskbar-scale)); font-size: calc(10px * var(--taskbar-scale)); }
      #batteryControl svg { width: calc(30px * var(--taskbar-scale)); }
      #shutdownControl img { width: calc(31px * var(--taskbar-scale)); height: calc(31px * var(--taskbar-scale)); }
      [hidden] { display: none !important; }
      @media (max-width: 520px) {
        .app { min-width: var(--taskbar-height); padding: 0 calc(7px * var(--taskbar-scale)); }
        .app span { display: none; }
        .clock { min-width: calc(66px * var(--taskbar-scale)); }
      }
    </style>
  </head>
  <body>
    <div class="taskbar" role="toolbar" aria-label="Safe Exam Browser taskbar">
      <div class="left">
        <div class="app" title="Safe Exam Browser">
          <img src="../icons/seb_logo.png" alt="">
          <span>Safe Exam Browser</span>
        </div>
        <button class="control" id="reloadControl" type="button" title="Reload current page" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" d="M20 11a8 8 0 1 0-2.3 5.7M20 5v6h-6"/></svg>
        </button>
      </div>
      <div class="right">
        <button class="control" id="audioControl" type="button" title="Mute audio" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M4 9v6h4l5 4V5L8 9H4z"/><path id="audioWaves" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" d="M16 9c1.3 1.7 1.3 4.3 0 6m2.7-8.5c2.7 3 2.7 8 0 11"/></svg>
        </button>
        <button class="control" id="batteryControl" type="button" title="Battery" hidden>
          <svg viewBox="0 0 40 28" aria-hidden="true">
            <rect x="2" y="5" width="33" height="18" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/>
            <rect x="35" y="10" width="3" height="8" rx="1" fill="currentColor"/>
            <rect id="batteryCharge" x="4" y="7" width="29" height="14" fill="#1f9f44"/>
          </svg>
        </button>
        <button class="control" id="networkControl" type="button" title="Network" hidden>
          <img src="../icons/wifi.svg" alt="">
        </button>
        <button class="control" id="keyboardControl" type="button" title="Keyboard layout" hidden>ENG</button>
        <div class="clock" id="clockControl" aria-label="Date and time" hidden>
          <span id="time">12:00</span>
          <span id="date">01/01/2024</span>
        </div>
        <button class="control" id="shutdownControl" type="button" title="Quit Safe Exam Browser" hidden>
          <img src="../icons/shutdown.svg" alt="">
        </button>
      </div>
    </div>
    <script src="taskbar.js"></script>
  </body>
</html>
